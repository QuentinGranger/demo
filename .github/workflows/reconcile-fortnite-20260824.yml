name: Reconcile Fortnite 2026-08-24

on:
  push:
    paths:
      - 'scripts/reconcile_fortnite_20260824.py'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reconcile canonical Fortnite state
        run: python scripts/reconcile_fortnite_20260824.py
      - name: Validate Fortnite calendars and change ledger
        run: |
          python scripts/validate_fortnite_ics.py
          python scripts/validate_fortnite_change_ledger.py
      - name: Commit reconciliation
        run: |
          if git diff --quiet; then
            echo 'No material reconciliation needed.'
            exit 0
          fi
          git config user.name 'calendar-health-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add calendars/
          git commit -m 'Reconcile LEGO Odyssey Monastery event'
          git push origin HEAD:master
