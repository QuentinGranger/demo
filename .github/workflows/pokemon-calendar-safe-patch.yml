name: Pokémon calendar safe patch

on:
  push:
    branches:
      - master
    paths:
      - 'calendars/patch-requests/*.json'

permissions:
  contents: write

concurrency:
  group: pokemon-calendar-safe-patch
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository history
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Capture every patch request from triggering commit
        id: requests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/pokemon-patch-requests
          mapfile -t reqs < <(
            git diff-tree --no-commit-id --name-only -r "${GITHUB_SHA}" -- 'calendars/patch-requests/*.json' \
              | sort -u
          )
          if [ "${#reqs[@]}" -eq 0 ]; then
            echo "No patch request in triggering commit"
            exit 1
          fi

          : > /tmp/pokemon-patch-requests/list.txt
          index=0
          for req in "${reqs[@]}"; do
            index=$((index + 1))
            dest="/tmp/pokemon-patch-requests/$(printf '%03d' "$index")-$(basename "$req")"
            cp "$req" "$dest"
            printf '%s\n' "$dest" >> /tmp/pokemon-patch-requests/list.txt
            echo "Captured request: $req -> $dest"
          done
          echo "count=${#reqs[@]}" >> "$GITHUB_OUTPUT"

      - name: Apply transaction on latest master and push with conflict retry
        id: apply
        shell: bash
        run: |
          set -euo pipefail
          target='calendars/pokemon-tcg-france.ics'
          mapfile -t reqs < /tmp/pokemon-patch-requests/list.txt
          git config user.name "pokemon-calendar-bot"
          git config user.email "pokemon-calendar-bot@users.noreply.github.com"

          success=0
          changed=0
          for attempt in $(seq 1 5); do
            echo "Transactional apply attempt ${attempt}/5"
            git fetch origin master --force
            git reset --hard origin/master

            python3 scripts/pokemon_calendar_batch_patch.py "${reqs[@]}"

            unexpected=$(git diff --name-only | grep -v -F -x "$target" || true)
            if [ -n "$unexpected" ]; then
              echo "Unexpected changed files:"
              echo "$unexpected"
              exit 1
            fi

            TARGET="$target" python3 - <<'PY'
          from pathlib import Path
          import os, re
          p = Path(os.environ['TARGET'])
          raw = p.read_bytes()
          text = raw.decode('utf-8')
          if not text.startswith('BEGIN:VCALENDAR') or not text.rstrip().endswith('END:VCALENDAR'):
              raise SystemExit('invalid VCALENDAR bounds')
          if text.count('BEGIN:VCALENDAR') != 1 or text.count('END:VCALENDAR') != 1:
              raise SystemExit('invalid VCALENDAR multiplicity')
          uids = re.findall(r'(?m)^UID:(.+)\r?$', text)
          if len(uids) != len(set(uids)):
              raise SystemExit('duplicate UIDs')
          if b'\n' in raw.replace(b'\r\n', b''):
              raise SystemExit('calendar contains non-CRLF line endings')
          print(f'Validated {len(uids)} unique VEVENT UIDs; bytes={len(raw)}')
          PY

            if git diff --quiet -- "$target"; then
              echo "No business change after recompute on latest master"
              changed=0
              success=1
              break
            fi

            git add "$target"
            git commit -m "calendar: apply transactional batch patch (${{ steps.requests.outputs.count }} request(s))"
            if git push origin HEAD:master; then
              changed=1
              success=1
              break
            fi

            echo "Push conflict detected; refetching and recomputing the batch"
            sleep 2
          done

          if [ "$success" -ne 1 ]; then
            echo "Transactional patch failed after conflict retries"
            exit 1
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

      - name: Verify canonical master after transaction
        shell: bash
        run: |
          set -euo pipefail
          target='calendars/pokemon-tcg-france.ics'
          mapfile -t reqs < /tmp/pokemon-patch-requests/list.txt
          git fetch origin master --force
          git show "origin/master:$target" > /tmp/canonical.ics
          python3 - /tmp/canonical.ics "${reqs[@]}" <<'PY'
          from pathlib import Path
          import json, re, sys

          calendar_path = Path(sys.argv[1])
          request_paths = [Path(p) for p in sys.argv[2:]]
          text = calendar_path.read_text(encoding='utf-8')
          if not text.startswith('BEGIN:VCALENDAR') or not text.rstrip().endswith('END:VCALENDAR'):
              raise SystemExit('master verification failed: invalid VCALENDAR bounds')
          uids = re.findall(r'(?m)^UID:(.+)\r?$', text)
          if len(uids) != len(set(uids)):
              raise SystemExit('master verification failed: duplicate UIDs')
          uid_set = set(uids)

          for request_path in request_paths:
              req = json.loads(request_path.read_text(encoding='utf-8'))
              uid = req.get('uid')
              if not uid:
                  match = re.search(r'(?m)^UID:(.+)$', req.get('event', ''))
                  uid = match.group(1).strip().rstrip('\r') if match else None
              if not uid:
                  raise SystemExit(f'{request_path}: request has no resolvable UID')
              expected = req.get('operation') != 'delete'
              present = uid in uid_set
              if present != expected:
                  raise SystemExit(
                      f'master verification failed: UID {uid} present={present}, expected={expected}'
                  )
              print(f'MASTER_VERIFIED=1 UID={uid} PRESENT={present}')
          PY

      - name: Verify public RAW subscription feed
        shell: bash
        run: |
          set -euo pipefail
          target='calendars/pokemon-tcg-france.ics'
          mapfile -t reqs < /tmp/pokemon-patch-requests/list.txt

          for attempt in $(seq 1 20); do
            raw_url="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/master/${target}?verify=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${attempt}-$(date +%s%N)"
            echo "RAW verification attempt ${attempt}/20"
            if curl --fail --silent --show-error --location \
              -H 'Cache-Control: no-cache' \
              -H 'Pragma: no-cache' \
              "$raw_url" -o /tmp/public-raw.ics; then
              if python3 - /tmp/public-raw.ics "${reqs[@]}" <<'PY'
          from pathlib import Path
          import json, re, sys

          calendar_path = Path(sys.argv[1])
          request_paths = [Path(p) for p in sys.argv[2:]]
          raw = calendar_path.read_bytes()
          text = raw.decode('utf-8')
          if not text.startswith('BEGIN:VCALENDAR') or not text.rstrip().endswith('END:VCALENDAR'):
              raise SystemExit(2)
          uids = re.findall(r'(?m)^UID:(.+)\r?$', text)
          if len(uids) != len(set(uids)):
              raise SystemExit(3)
          uid_set = set(uids)

          for request_path in request_paths:
              req = json.loads(request_path.read_text(encoding='utf-8'))
              uid = req.get('uid')
              if not uid:
                  match = re.search(r'(?m)^UID:(.+)$', req.get('event', ''))
                  uid = match.group(1).strip().rstrip('\r') if match else None
              if not uid:
                  raise SystemExit(4)
              expected = req.get('operation') != 'delete'
              if (uid in uid_set) != expected:
                  raise SystemExit(5)
          print(f'PUBLIC_RAW_VERIFIED=1 REQUESTS={len(request_paths)} BYTES={len(raw)}')
          PY
              then
                exit 0
              fi
            fi
            sleep 3
          done

          echo "::warning::CHECK_INCONCLUSIVE — public RAW feed did not converge after propagation retries; canonical master was already verified."
          echo "PUBLIC_RAW_CHECK=CHECK_INCONCLUSIVE"
          exit 0
