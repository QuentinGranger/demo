name: Pokémon calendar safe patch

on:
  push:
    branches:
      - master
    paths:
      - 'calendars/patch-requests/*.json'

permissions:
  contents: write

concurrency:
  group: pokemon-calendar-safe-patch
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Select request from triggering commit
        id: request
        shell: bash
        run: |
          set -euo pipefail
          req=$(git diff-tree --no-commit-id --name-only -r "${GITHUB_SHA}" -- 'calendars/patch-requests/*.json' | head -n 1)
          if [ -z "$req" ]; then
            echo "No patch request in triggering commit"
            exit 1
          fi
          echo "path=$req" >> "$GITHUB_OUTPUT"
          echo "Using request: $req"

      - name: Resolve target calendar and expected UID
        id: target
        shell: bash
        run: |
          set -euo pipefail
          python3 - "${{ steps.request.outputs.path }}" "$GITHUB_OUTPUT" <<'PY'
          import json, sys
          req_path, out_path = sys.argv[1], sys.argv[2]
          allowed = {
              'calendars/pokemon-paris.ics',
              'calendars/pokemon-tcg-france.ics',
          }
          req = json.load(open(req_path, encoding='utf-8'))
          cal = req.get('calendar_path', 'calendars/pokemon-tcg-france.ics')
          if cal not in allowed:
              raise SystemExit(f'calendar_path not allowed: {cal}')
          op = req.get('operation')
          uid = req.get('uid')
          if not uid and op in ('add', 'upsert', 'update'):
              import re
              m = re.search(r'(?m)^UID:(.+)$', req.get('event', ''))
              uid = m.group(1).strip() if m else None
          if not uid:
              raise SystemExit('request has no resolvable UID')
          with open(out_path, 'a', encoding='utf-8') as f:
              f.write(f'path={cal}\n')
              f.write(f'uid={uid}\n')
              f.write(f'operation={op}\n')
          print(f'Target calendar: {cal}')
          print(f'Expected UID: {uid}')
          print(f'Operation: {op}')
          PY

      - name: Verify request against current calendar and apply
        run: |
          set -euo pipefail
          python3 scripts/pokemon_calendar_safe_patch.py "${{ steps.request.outputs.path }}"

      - name: Validate no collateral file changes
        shell: bash
        run: |
          set -euo pipefail
          target="${{ steps.target.outputs.path }}"
          changed=$(git diff --name-only)
          if [ -z "$changed" ]; then
            echo "No business change"
            exit 0
          fi
          unexpected=$(printf '%s\n' "$changed" | grep -v -F -x "$target" || true)
          if [ -n "$unexpected" ]; then
            echo "Unexpected changed files:"
            echo "$unexpected"
            exit 1
          fi
          TARGET="$target" python3 - <<'PY'
          from pathlib import Path
          import os, re
          p = Path(os.environ['TARGET'])
          t = p.read_bytes().decode('utf-8')
          assert t.startswith('BEGIN:VCALENDAR\r\n')
          assert t.rstrip().endswith('END:VCALENDAR')
          assert t.count('BEGIN:VCALENDAR') == 1
          assert t.count('END:VCALENDAR') == 1
          uids = re.findall(r'(?m)^UID:(.+)\r$', t)
          assert len(uids) == len(set(uids)), 'duplicate UIDs'
          print(f'Validated {len(uids)} unique VEVENT UIDs in {p}')
          PY

      - name: Commit target calendar only
        shell: bash
        run: |
          set -euo pipefail
          target="${{ steps.target.outputs.path }}"
          if git diff --quiet -- "$target"; then
            echo "No calendar change to commit"
            exit 0
          fi
          git config user.name "pokemon-calendar-bot"
          git config user.email "pokemon-calendar-bot@users.noreply.github.com"
          git add "$target"
          git commit -m "calendar: apply safe event patch"
          git push origin HEAD:master

      - name: Verify canonical master after write
        shell: bash
        run: |
          set -euo pipefail
          target="${{ steps.target.outputs.path }}"
          uid="${{ steps.target.outputs.uid }}"
          op="${{ steps.target.outputs.operation }}"
          git fetch origin master --force
          git show "origin/master:$target" > /tmp/canonical.ics
          python3 - /tmp/canonical.ics "$uid" "$op" <<'PY'
          from pathlib import Path
          import re, sys
          path, uid, op = sys.argv[1:]
          text = Path(path).read_text(encoding='utf-8')
          if not text.startswith('BEGIN:VCALENDAR') or not text.rstrip().endswith('END:VCALENDAR'):
              raise SystemExit('master verification failed: invalid VCALENDAR bounds')
          uids = re.findall(r'(?m)^UID:(.+)\r?$', text)
          if len(uids) != len(set(uids)):
              raise SystemExit('master verification failed: duplicate UIDs')
          present = uid in uids
          expected = op != 'delete'
          if present != expected:
              raise SystemExit(f'master verification failed: UID {uid} present={present}, expected={expected}')
          print(f'MASTER_VERIFIED=1 UID={uid} PRESENT={present}')
          PY

      - name: Verify public RAW subscription feed
        shell: bash
        run: |
          set -euo pipefail
          target="${{ steps.target.outputs.path }}"
          uid="${{ steps.target.outputs.uid }}"
          op="${{ steps.target.outputs.operation }}"
          expected_present=true
          if [ "$op" = "delete" ]; then expected_present=false; fi

          for attempt in $(seq 1 20); do
            raw_url="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/master/${target}?verify=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${attempt}-$(date +%s%N)"
            echo "RAW verification attempt ${attempt}/20"
            if curl --fail --silent --show-error --location \
              -H 'Cache-Control: no-cache' \
              -H 'Pragma: no-cache' \
              "$raw_url" -o /tmp/public-raw.ics; then
              if python3 - /tmp/public-raw.ics "$uid" "$op" <<'PY'
          from pathlib import Path
          import re, sys
          path, uid, op = sys.argv[1:]
          raw = Path(path).read_bytes()
          text = raw.decode('utf-8')
          if not text.startswith('BEGIN:VCALENDAR') or not text.rstrip().endswith('END:VCALENDAR'):
              raise SystemExit(2)
          uids = re.findall(r'(?m)^UID:(.+)\r?$', text)
          if len(uids) != len(set(uids)):
              raise SystemExit(3)
          present = uid in uids
          expected = op != 'delete'
          if present != expected:
              raise SystemExit(4)
          print(f'PUBLIC_RAW_VERIFIED=1 UID={uid} PRESENT={present} BYTES={len(raw)}')
          PY
              then
                exit 0
              fi
            fi
            sleep 3
          done

          echo "RAW verification failed after propagation retries for UID=$uid expected_present=$expected_present"
          exit 1
