name: Reconcile Fortnite Fan Fest access once

on:
  push:
    paths:
      - '.github/workflows/reconcile-fortnite-fan-fest-once.yml'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - name: Rebase on latest master
        run: git pull --ff-only origin master
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reconcile canonical ledgers, outbox, index and ICS
        shell: python
        run: |
          import hashlib, json, pathlib, re
          from datetime import datetime, timezone

          ROOT = pathlib.Path('.')
          CAL = ROOT / 'calendars'
          now = datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z')

          ledger_p = CAL / 'fortnite-change-ledger.json'
          outbox_p = CAL / 'fortnite-notification-outbox-france.json'
          index_p = CAL / 'fortnite-change-index-france.json'
          ledger = json.loads(ledger_p.read_text(encoding='utf-8'))
          outbox = json.loads(outbox_p.read_text(encoding='utf-8'))
          index = json.loads(index_p.read_text(encoding='utf-8'))

          def canon(x):
              return json.dumps(x, ensure_ascii=False, sort_keys=True, separators=(',', ':'))
          def sha(s):
              return hashlib.sha256(s.encode('utf-8')).hexdigest()
          def make_change(domain, subject_key, scope_key, revision, parent, change_type, materiality, before, after, evidence, refs, disposition, causal=None, notes=None, targets=None):
              subject_scope_key = 'sub_' + sha('|'.join([domain, subject_key, scope_key or '']))
              state_fp = sha(canon(after))
              transition_fp = sha(canon({'change_type':change_type,'material_before':before,'material_after':after,'material_evidence_state':evidence}))
              cid = 'chg_' + sha('|'.join([domain, subject_key, scope_key or '', str(revision), parent or 'null', transition_fp]))[:24]
              rec = {
                  'change_id':cid,'domain':domain,'subject_scope_key':subject_scope_key,'subject_key':subject_key,
                  'subject_revision':revision,'causal_parent_change_id':parent,'change_type':change_type,'materiality':materiality,
                  'state_fingerprint':state_fp,'transition_fingerprint':transition_fp,'detected_at':now,'source_refs':refs,
                  'notification_disposition':disposition,'scope_key':scope_key,'material_before':before,'material_after':after,
                  'material_evidence_state':evidence,'policy_version':'FORTNITE_CHANGE_ENGINE_FR_V2'
              }
              if causal: rec['causal_source_change_ids']=causal
              if notes: rec['notes']=notes
              if targets: rec['projection_targets']=targets
              return rec

          guide = 'https://ewc-web.prod.esf-systems.com/en/news/ewc26-fortnite-survival-guide'
          ticket_url = 'https://paris.platinumlist.net/fr/event-tickets/106986/fan-fest-at-ewc26'
          event_uid = 'fortnite-reload-elite-ewc-paris-20260819@openai'
          evidence = 'DIRECT_TICKETING_AVAILABLE_PLUS_EWC_WATCH_PARTY_CREDENTIAL'

          # Fresh canonical guard: the business ledgers must still assert the exact actionable state.
          ticketing = json.loads((CAL/'fortnite-ticketing-france.json').read_text(encoding='utf-8'))
          tentry = next((e for e in ticketing.get('entries',[]) if e.get('event_uid')==event_uid), None)
          cat = next((c for c in (tentry or {}).get('category_states',[]) if c.get('category_key')=='FAN_FEST_DAY_ACCESS'), None)
          access = json.loads((CAL/'fortnite-physical-access-france.json').read_text(encoding='utf-8'))
          aentry = next((e for e in access.get('entries',[]) if e.get('event_uid')==event_uid), None)
          watch = next((s for s in (aentry or {}).get('session_overrides',[]) if s.get('scope_key')=='WATCH_PARTIES'), None)
          if not cat or cat.get('status')!='AVAILABLE' or float(cat.get('price_eur') or -1)!=4.99 or cat.get('ticket_url')!=ticket_url:
              raise SystemExit('Fresh canonical guard failed: Fan Fest inventory is no longer AVAILABLE at the tracked €4.99 path.')
          if not watch or watch.get('ticket_inventory_state')!='AVAILABLE' or watch.get('acquisition_action')!='BUY_TICKET':
              raise SystemExit('Fresh canonical guard failed: watch-party access is no longer actionable.')

          existing = {c['change_id']:c for c in ledger.get('changes',[])}
          # Ticket availability is a new scoped subject, distinct from the sold-out main-stage category.
          ticket_subject = event_uid + '|platinumlist_paris|FAN_FEST_DAY_ACCESS'
          ticket_scope = 'platinumlist_paris|FAN_FEST_DAY_ACCESS'
          ticket_before = {'status':'ANNOUNCED','category_key':'FAN_FEST_DAY_ACCESS','provider_id':'platinumlist_paris'}
          ticket_after = {'status':'AVAILABLE','category_key':'FAN_FEST_DAY_ACCESS','provider_id':'platinumlist_paris','price_from_eur':4.99,'acquisition_action':'BUY_TICKET','ticket_url':ticket_url}
          ticket_change = make_change('TICKETING',ticket_subject,ticket_scope,1,None,'AVAILABILITY_CHANGED','NOTIFY',ticket_before,ticket_after,evidence,[guide,ticket_url],'ELIGIBLE_NOW',notes='Fan Fest day-ticket inventory became directly actionable; this does not reopen the sold-out Fortnite main stage.')

          access_subject = 'fortnite-access-ewc-paris-2026|WATCH_PARTIES'
          access_scope = 'WATCH_PARTIES'
          access_ss = 'sub_' + sha('|'.join(['PHYSICAL_ACCESS',access_subject,access_scope]))
          heads = sorted((c for c in ledger.get('changes',[]) if c.get('subject_scope_key')==access_ss), key=lambda c:c.get('subject_revision',0))
          if heads and (heads[-1].get('subject_revision') != 1 or heads[-1].get('change_id') != 'chg_1a50d1b097989310794ddbb1'):
              raise SystemExit('Causal guard failed: WATCH_PARTIES subject advanced; abort stale reconciliation.')
          access_before = {'access_state':'TICKET_REQUIRED','required_credential':'VALID_FAN_FEST_TICKET_FOR_THE_DAY','ticket_inventory_state':'UNKNOWN','acquisition_action':'FOLLOW'}
          access_after = {'access_state':'TICKET_REQUIRED','required_credential':'VALID_FAN_FEST_TICKET_FOR_THE_DAY','ticket_inventory_state':'AVAILABLE','acquisition_action':'BUY_TICKET','ticket_price_from_eur':4.99,'ticket_provider_id':'platinumlist_paris','ticket_url':ticket_url}
          access_change = make_change('PHYSICAL_ACCESS',access_subject,access_scope,2,'chg_1a50d1b097989310794ddbb1','ACCESS_CHANGED','CALENDAR',access_before,access_after,evidence,[guide,ticket_url],'NOT_APPLICABLE',causal=[ticket_change['change_id']],notes='Mirror access change linked to the ticketing cause; notification must collapse to the single ticketing user effect.',targets=['calendars/fortnite-competitive-france.ics','calendars/fortnite-paris.ics'])

          added = False
          for rec in (ticket_change, access_change):
              if rec['change_id'] not in existing:
                  ledger.setdefault('changes',[]).append(rec); existing[rec['change_id']]=rec; added=True
          if added:
              ledger['updated_at']=now
              ledger.setdefault('history',[]).append({'at':now,'type':'MATERIAL_EWC_FAN_FEST_AVAILABILITY','note':'Fan Fest day tickets for EWC Paris watch-party access reconciled as AVAILABLE from €4.99; Fortnite main-stage inventory remains SOLD_OUT.'})

          # Exactly-once logical intent; reservation and change records are persisted atomically in this commit.
          cids = sorted([ticket_change['change_id'], access_change['change_id']])
          notice = 'EWC_FAN_FEST_WATCH_PARTY_ACCESS_AVAILABLE'
          nkey = 'ntf_' + sha('|'.join(['|'.join(cids),notice,'user','chat']))
          iid = 'nti_' + sha(nkey)[:24]
          payload = '🎟️ EWC Paris — les billets Fan Fest donnant accès aux watch parties Fortnite sont actuellement achetables à partir de 4,99 €. La scène principale Fortnite reste complète ; ce billet Fan Fest ne la rouvre pas.'
          if nkey not in {i.get('notification_key') for i in outbox.get('intents',[])}:
              intent = {'intent_id':iid,'notification_key':nkey,'change_ids':cids,'notice_kind':notice,'audience_key':'user','channel_key':'chat','payload_fingerprint':sha(payload),'render_version':'FORTNITE_ALERT_FR_V1','created_at':now,'subject_key':event_uid,'locale':'fr-FR','payload_snapshot':payload,'condition_snapshot':{'fan_fest_day_access':'AVAILABLE','price_from_eur':4.99,'ticket_provider_id':'platinumlist_paris','main_stage_ticket_status':'SOLD_OUT','watch_party_required_credential':'VALID_FAN_FEST_TICKET_FOR_THE_DAY','event_live':True},'policy_version':'FORTNITE_CHANGE_ENGINE_FR_V2'}
              rid = 'nrs_' + sha('|'.join([nkey,'reservation',now]))[:24]
              eid = 'nde_' + sha('|'.join([iid,'RESERVED','1',now]))[:24]
              delivery = {'delivery_event_id':eid,'intent_id':iid,'notification_key':nkey,'state':'RESERVED','at':now,'reservation_id':rid,'note':'Reserved after fresh canonical Fan Fest availability guard. This key is consumed even if delivery acknowledgement is later unknown.'}
              outbox.setdefault('intents',[]).append(intent)
              outbox.setdefault('delivery_events',[]).append(delivery)
              outbox['updated_at']=now

          # Rebuild consumed_keys exactly from append-only delivery events.
          intents_by_id={i['intent_id']:i for i in outbox.get('intents',[])}
          by_intent={}
          for e in outbox.get('delivery_events',[]): by_intent.setdefault(e['intent_id'],[]).append(e)
          consumed={}
          for ii, evs in by_intent.items():
              latest=None; reserved=False
              for e in sorted(evs,key=lambda x:x.get('at','')):
                  st=e.get('state')
                  if st=='RESERVED': reserved=True; latest=e
                  elif st in ('SENT','UNKNOWN_DELIVERY'):
                      if reserved: latest=e
              if latest and ii in intents_by_id:
                  k=intents_by_id[ii]['notification_key']; consumed[k]={'intent_id':ii,'state':latest['state'],'last_event_id':latest['delivery_event_id']}
          outbox['consumed_keys']=consumed

          # Patch only the EWC VEVENT in both projections, preserving all unrelated physical lines.
          def fold_line(line):
              parts=[]; cur=''; limit=75
              for ch in line:
                  candidate=cur+ch
                  allowed=limit if not parts else 74
                  if len(candidate.encode('utf-8'))>allowed and cur:
                      parts.append(cur); cur=ch
                  else: cur=candidate
              parts.append(cur)
              return '\r\n '.join(parts)
          def patch_ics(path):
              raw=path.read_text(encoding='utf-8')
              text=raw.replace('\r\n','\n').replace('\r','\n')
              phys=text.split('\n')
              # logical lines with physical boundaries
              logical=[]; starts=[]; ends=[]
              i=0
              while i < len(phys):
                  start=i; line=phys[i]; i+=1
                  while i<len(phys) and phys[i].startswith((' ','\t')):
                      line += phys[i][1:]; i+=1
                  logical.append(line); starts.append(start); ends.append(i)
              uid_idx=next((j for j,l in enumerate(logical) if l=='UID:'+event_uid),None)
              if uid_idx is None: raise SystemExit(f'{path}: EWC UID missing')
              begin=max(j for j in range(uid_idx+1) if logical[j]=='BEGIN:VEVENT')
              end=next(j for j in range(uid_idx,len(logical)) if logical[j]=='END:VEVENT')
              event=logical[begin:end+1]
              def set_line(prefix,newline):
                  for k,l in enumerate(event):
                      if l.startswith(prefix): event[k]=newline; return True
                  return False
              seq_i=next(k for k,l in enumerate(event) if l.startswith('SEQUENCE:'))
              old_seq=int(event[seq_i].split(':',1)[1]); event[seq_i]=f'SEQUENCE:{old_seq+1}'
              stamp=datetime.now(timezone.utc).strftime('%Y%m%dT%H%M%SZ')
              set_line('DTSTAMP:', 'DTSTAMP:'+stamp); set_line('LAST-MODIFIED:', 'LAST-MODIFIED:'+stamp)
              oldcat='X-FORTNITE-TICKET-CATEGORY;KEY=FAN_FEST_DAY_ACCESS;STATUS=ANNOUNCED:'
              replaced=False
              for k,l in enumerate(event):
                  if l.startswith(oldcat):
                      event[k]='X-FORTNITE-TICKET-CATEGORY;KEY=FAN_FEST_DAY_ACCESS;STATUS=AVAILABLE;PRICE-EUR=4.99;PROVIDER-ID=platinumlist_paris:Billet Fan Fest valide pour la journée — accès watch parties'; replaced=True
              if not replaced and not any('KEY=FAN_FEST_DAY_ACCESS;STATUS=AVAILABLE' in l for l in event):
                  raise SystemExit(f'{path}: expected Fan Fest category state not found')
              for k,l in enumerate(event):
                  if l.startswith('X-FORTNITE-PUBLIC-SESSION;TYPE=PUBLIC_VIEWING;STATUS=ANNOUNCED;ACCESS=FAN_FEST_DAY_TICKET:'):
                      event[k]=l.replace('STATUS=ANNOUNCED','STATUS=AVAILABLE',1)
              # add actionable purchase metadata once
              insert_at=next((k for k,l in enumerate(event) if l.startswith('X-FORTNITE-TIME-PRECISION:')),None)
              extras=[]
              if not any(l.startswith('X-FORTNITE-WATCH-PARTY-TICKET-URL:') for l in event): extras.append('X-FORTNITE-WATCH-PARTY-TICKET-URL:'+ticket_url)
              if not any(l.startswith('X-FORTNITE-WATCH-PARTY-TICKET-PRICE-FROM-EUR:') for l in event): extras.append('X-FORTNITE-WATCH-PARTY-TICKET-PRICE-FROM-EUR:4.99')
              if extras and insert_at is not None: event[insert_at:insert_at]=extras
              for k,l in enumerate(event):
                  if l.startswith('DESCRIPTION:'):
                      old='Des watch parties Fortnite sont annoncées sur les Qiddiya City BattleGrounds stages et nécessitent un billet Fan Fest valide pour la journée. Le stock\\, le prix et les horaires exacts des billets Fan Fest ne sont pas affirmés.'
                      new='Des watch parties Fortnite sont annoncées sur les Qiddiya City BattleGrounds stages et nécessitent un billet Fan Fest valide pour la journée. Billets Fan Fest actuellement achetables à partir de 4\\,99 € via Platinumlist ; la scène principale Fortnite reste complète. Les horaires exacts des watch parties ne sont pas affirmés.'
                      if old in l: event[k]=l.replace(old,new)
              # Replace the physical slice covering the event with freshly folded event only.
              pstart=starts[begin]; pend=ends[end]
              replacement=[]
              for l in event: replacement.extend(fold_line(l).split('\r\n'))
              newphys=phys[:pstart]+replacement+phys[pend:]
              out='\r\n'.join(newphys)
              if not out.endswith('\r\n'): out+='\r\n'
              path.write_text(out,encoding='utf-8',newline='')

          for p in (CAL/'fortnite-paris.ics', CAL/'fortnite-competitive-france.ics'):
              patch_ics(p)

          # Rebuild the derived index from canonical ledger/outbox while preserving policy metadata.
          changes=ledger.get('changes',[])
          heads={}
          by_domain={}; by_type={}; open_by={}
          for c in changes:
              ss=c['subject_scope_key']; rev=c['subject_revision']
              if ss not in heads or rev>heads[ss]['revision']: heads[ss]={'revision':rev,'change_id':c['change_id']}
              by_domain.setdefault(c['domain'],[]).append(c['change_id'])
              by_type.setdefault(c['change_type'],[]).append(c['change_id'])
              if c.get('state','OPEN')=='OPEN': open_by.setdefault(ss,[]).append(c['change_id'])
          for d in (by_domain,by_type,open_by):
              for k in d: d[k]=sorted(d[k])
          index['updated_at']=now
          index['subject_heads']={k:heads[k] for k in sorted(heads)}
          index['by_domain']={k:by_domain[k] for k in sorted(by_domain)}
          index['by_change_type']={k:by_type[k] for k in sorted(by_type)}
          index['open_changes_by_subject']={k:open_by[k] for k in sorted(open_by)}
          index['consumed_notification_keys']=sorted(consumed)
          index['unknown_delivery_keys']=sorted(k for k,v in consumed.items() if v.get('state')=='UNKNOWN_DELIVERY')
          index['pending_reconciliation']=[r for r in index.get('pending_reconciliation',[]) if r.get('reconciliation_id')!='rec_fan_fest_watch_party_access_20260822']
          index['stats']={'changes':len(changes),'subjects':len(heads),'notification_intents':len(outbox.get('intents',[])),'consumed_notification_keys':len(consumed),'unknown_delivery':len(index['unknown_delivery_keys']),'pending_reconciliation':len(index['pending_reconciliation'])}

          ledger_p.write_text(json.dumps(ledger,ensure_ascii=False,separators=(',',':'))+'\n',encoding='utf-8')
          outbox_p.write_text(json.dumps(outbox,ensure_ascii=False,separators=(',',':'))+'\n',encoding='utf-8')
          index_p.write_text(json.dumps(index,ensure_ascii=False,separators=(',',':'))+'\n',encoding='utf-8')
      - name: Validate Fortnite change ledger and ICS
        run: |
          python scripts/validate_fortnite_change_ledger.py
          python scripts/validate_fortnite_ics.py
      - name: Commit reconciliation
        run: |
          if git diff --quiet; then
            echo 'No reconciliation changes required.'
            exit 0
          fi
          git config user.name 'Quentin Everdeen'
          git config user.email '65540433+QuentinGranger@users.noreply.github.com'
          git add calendars/fortnite-change-ledger.json calendars/fortnite-notification-outbox-france.json calendars/fortnite-change-index-france.json calendars/fortnite-paris.ics calendars/fortnite-competitive-france.ics
          git commit -m 'Reconcile EWC Fan Fest watch-party access'
          git push origin master
