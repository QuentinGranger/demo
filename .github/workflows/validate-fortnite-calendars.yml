name: Validate Fortnite calendars

on:
  push:
    paths:
      - 'calendars/fortnite-*.ics'
      - 'calendars/fortnite-ics-validation.json'
      - 'scripts/validate_fortnite_ics.py'
      - 'scripts/sync_fortnite_calendars.py'
      - '.gitattributes'
      - '.github/workflows/validate-fortnite-calendars.yml'
  pull_request:
    paths:
      - 'calendars/fortnite-*.ics'
      - 'calendars/fortnite-ics-validation.json'
      - 'scripts/validate_fortnite_ics.py'
      - 'scripts/sync_fortnite_calendars.py'
      - '.gitattributes'
      - '.github/workflows/validate-fortnite-calendars.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Synchronize global feed and normalize RFC 5545 serialization
        run: python scripts/sync_fortnite_calendars.py

      - name: Validate RFC 5545, Apple serialization and mirrored Fortnite feeds
        run: python scripts/validate_fortnite_ics.py

      - name: Persist deterministic sync/normalization
        if: github.event_name == 'push' && github.actor != 'github-actions[bot]'
        run: |
          if git diff --quiet -- calendars/fortnite-paris.ics calendars/fortnite-updates-france.ics calendars/fortnite-competitive-france.ics; then
            echo "No deterministic calendar rewrite needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add calendars/fortnite-paris.ics calendars/fortnite-updates-france.ics calendars/fortnite-competitive-france.ics
          git commit -m "Normalize and synchronize Fortnite calendars"
          git push
