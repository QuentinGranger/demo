name: ZERO MISS LEGO Pokémon 2026-10-01

on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/patch-lego-pokemon-20261001.yml'
      - 'scripts/patch_lego_pokemon_20261001.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Patch canonical calendar
        run: python3 scripts/patch_lego_pokemon_20261001.py

      - name: Commit changes
        run: |
          if git diff --quiet -- calendars/pokemon-paris.ics; then
            echo "No business change"
            exit 0
          fi
          git config user.name "pokemon-calendar-bot"
          git config user.email "pokemon-calendar-bot@users.noreply.github.com"
          git add calendars/pokemon-paris.ics
          git commit -m "calendar: add LEGO Pokémon 1 Oct wave"
          git push origin HEAD:master
