name: ZERO MISS JCC Live 30th 2026-09-15

on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/patch-tcg-live-30th-20260915.yml'
      - 'scripts/patch_tcg_live_30th_20260915.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Patch canonical calendar
        run: python3 scripts/patch_tcg_live_30th_20260915.py

      - name: Commit changes
        run: |
          if git diff --quiet -- calendars/pokemon-paris.ics; then
            echo "No business change"
            exit 0
          fi
          git config user.name "pokemon-calendar-bot"
          git config user.email "pokemon-calendar-bot@users.noreply.github.com"
          git add calendars/pokemon-paris.ics
          git commit -m "calendar: add JCC Live 30th digital release"
          git push origin HEAD:master
