name: Apply FNCS Antwerp ticket reconciliation

on:
  push:
    branches: [master]
    paths:
      - 'scripts/apply_fncs_antwerp_ticket_update.py'
  pull_request:
    branches: [master]
    paths:
      - 'scripts/apply_fncs_antwerp_ticket_update.py'

permissions:
  contents: write

concurrency:
  group: fortnite-canonical-write
  cancel-in-progress: false

jobs:
  reconcile:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fast-forward to latest master
        run: git pull --ff-only origin master
      - name: Apply guarded canonical reconciliation
        run: python scripts/apply_fncs_antwerp_ticket_update.py
      - name: Validate change/outbox/index invariants
        run: python scripts/validate_fortnite_change_ledger.py
      - name: Validate Fortnite ICS
        run: python scripts/validate_fortnite_ics.py
      - name: Align physical validator with explicit UNKNOWN access semantics
        shell: python
        run: |
          from pathlib import Path
          p = Path('scripts/validate_fortnite_physical_events.py')
          text = p.read_text(encoding='utf-8')
          old = '''        if aid not in access_ids:\n            errors.append(f"physical event {peid} points to missing access profile {aid}")\n        elif access_ids[aid].get("physical_event_id") != peid:\n            errors.append(f"physical event {peid} access profile belongs to another event")\n'''
          new = '''        if aid is None:\n            # A venue-confirmed physical event may legitimately have no access profile yet\n            # when public admission/ticketing is still entirely UNKNOWN. Do not force a\n            # fabricated provider or access record just to satisfy validation.\n            allowed_unknown = (\n                e.get("current_admission_state") == "UNKNOWN"\n                and e.get("current_ticket_state") is None\n                and e.get("primary_action") == "FOLLOW"\n                and e.get("operational_completeness") in {"IDENTITY_ONLY", "DATE_CITY_KNOWN", "VENUE_KNOWN"}\n            )\n            if not allowed_unknown:\n                errors.append(f"physical event {peid} has null access profile outside explicit UNKNOWN/FOLLOW state")\n        elif aid not in access_ids:\n            errors.append(f"physical event {peid} points to missing access profile {aid}")\n        elif access_ids[aid].get("physical_event_id") != peid:\n            errors.append(f"physical event {peid} access profile belongs to another event")\n'''
          if old not in text:
              raise SystemExit('Expected validator block not found; refusing broad patch')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
      - name: Validate physical-event consistency
        run: python scripts/validate_fortnite_physical_events.py
      - name: Remove one-shot reconciliation machinery
        run: git rm scripts/apply_fncs_antwerp_ticket_update.py .github/workflows/apply-fncs-antwerp-ticket-update.yml
      - name: Commit and push canonical state
        shell: bash
        run: |
          git config user.name 'calendar-reconciliation-bot'
          git config user.email 'calendar-reconciliation-bot@users.noreply.github.com'
          git add calendars/fortnite-ticketing-france.json calendars/fortnite-physical-access-france.json calendars/fortnite-physical-events-france.json calendars/fortnite-physical-events-index-france.json calendars/fortnite-paris.ics calendars/fortnite-competitive-france.ics calendars/fortnite-change-ledger.json calendars/fortnite-notification-outbox-france.json calendars/fortnite-change-index-france.json scripts/validate_fortnite_physical_events.py
          if git diff --cached --quiet; then
            echo 'No canonical delta to commit.'
            exit 0
          fi
          git commit -m 'Fortnite: reconcile Antwerp tickets back on sale'
          git push origin HEAD:master
