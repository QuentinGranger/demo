name: Apply FNCS Antwerp ticket reconciliation

on:
  push:
    branches: [master]
    paths:
      - 'scripts/apply_fncs_antwerp_ticket_update.py'

permissions:
  contents: write

concurrency:
  group: fortnite-canonical-write
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fast-forward to latest master
        run: git pull --ff-only origin master
      - name: Apply guarded canonical reconciliation
        run: python scripts/apply_fncs_antwerp_ticket_update.py
      - name: Validate change/outbox/index invariants
        run: python scripts/validate_fortnite_change_ledger.py
      - name: Validate Fortnite ICS
        run: python scripts/validate_fortnite_ics.py
      - name: Validate physical-event consistency
        run: python scripts/validate_fortnite_physical_events.py
      - name: Remove one-shot reconciliation machinery
        run: git rm scripts/apply_fncs_antwerp_ticket_update.py .github/workflows/apply-fncs-antwerp-ticket-update.yml
      - name: Commit and push canonical state
        shell: bash
        run: |
          git config user.name 'calendar-reconciliation-bot'
          git config user.email 'calendar-reconciliation-bot@users.noreply.github.com'
          git add calendars/fortnite-ticketing-france.json calendars/fortnite-physical-access-france.json calendars/fortnite-physical-events-france.json calendars/fortnite-physical-events-index-france.json calendars/fortnite-paris.ics calendars/fortnite-competitive-france.ics calendars/fortnite-change-ledger.json calendars/fortnite-notification-outbox-france.json calendars/fortnite-change-index-france.json
          if git diff --cached --quiet; then
            echo 'No canonical delta to commit.'
            exit 0
          fi
          git commit -m 'Fortnite: reconcile Antwerp tickets back on sale'
          git push origin HEAD:master
