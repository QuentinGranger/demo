name: ZERO MISS 30th Eevee formats
on:
  push:
    paths:
      - 'scripts/patch_30th_evoli_formats.py'
      - '.github/workflows/patch-30th-evoli-formats.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - name: Patch canonical calendar
        run: python scripts/patch_30th_evoli_formats.py
      - name: Validate and commit
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('calendars/pokemon-paris.ics').read_text(encoding='utf-8')
          assert s.startswith('BEGIN:VCALENDAR') and s.rstrip().endswith('END:VCALENDAR')
          assert s.count('UID:74a1a108-68cd-4c81-b8f1-9206bfa31970@openai') == 1
          assert 'X-POKEMON-WAVE-PRODUCT-COUNT:10' in s
          assert 'Blister 2 boosters 30e Anniversaire Évoli' in s
          assert 'Collection K.O. 30e Anniversaire Évoli' in s
          PY
          if git diff --quiet -- calendars/pokemon-paris.ics; then
            echo 'No business change'; exit 0
          fi
          git config user.name 'pokemon-calendar-bot'
          git config user.email 'pokemon-calendar-bot@users.noreply.github.com'
          git add calendars/pokemon-paris.ics
          git commit -m 'calendar: add distinct 30th Eevee launch formats'
          git push origin master
