name: Apply Pokémon Worlds/PokémonXP update

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/apply-pokemon-worlds-pxp-20260826.yml'
      - 'scripts/apply_pokemon_worlds_pxp_20260826.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply calendar update
        run: python scripts/apply_pokemon_worlds_pxp_20260826.py
      - name: Commit update and clean one-shot files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f scripts/apply_pokemon_worlds_pxp_20260826.py .github/workflows/apply-pokemon-worlds-pxp-20260826.yml
          if git diff --quiet -- calendars/pokemon-events-france-paris.ics scripts/apply_pokemon_worlds_pxp_20260826.py .github/workflows/apply-pokemon-worlds-pxp-20260826.yml; then
            echo 'No changes to commit.'
            exit 0
          fi
          git add calendars/pokemon-events-france-paris.ics
          git commit -m 'Add Pokémon Worlds and PokémonXP streams'
          git push origin HEAD:master
