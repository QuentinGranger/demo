name: One-off Pokémon calendar update 2026-08-19

on:
  push:
    paths:
      - '.github/workflows/oneoff-pokemon-20260819.yml'
      - 'scripts/oneoff_pokemon_20260819.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply Pokémon updates
        run: python scripts/oneoff_pokemon_20260819.py
      - name: Validate generic permanent calendar health
        run: python scripts/validate_calendar_health.py
      - name: Commit calendars and remove one-off files
        run: |
          git config user.name 'OpenAI Calendar Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm scripts/oneoff_pokemon_20260819.py .github/workflows/oneoff-pokemon-20260819.yml
          git add calendars/pokemon-paris.ics calendars/pokemon-tcg-france.ics calendars/pokemon-events-france-paris.ics
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m 'feat: update Pokémon France calendars'
          git push
