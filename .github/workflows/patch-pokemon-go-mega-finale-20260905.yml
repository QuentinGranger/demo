name: Patch Pokémon GO Mega Finale 2026-09-05

on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/patch-pokemon-go-mega-finale-20260905.yml'
      - 'scripts/patch_pokemon_go_mega_finale_20260905.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Patch canonical calendar
        run: python3 scripts/patch_pokemon_go_mega_finale_20260905.py

      - name: Commit changes
        run: |
          if git diff --quiet -- calendars/pokemon-paris.ics; then
            echo "No business change"
            exit 0
          fi
          git config user.name "pokemon-calendar-bot"
          git config user.email "pokemon-calendar-bot@users.noreply.github.com"
          git add calendars/pokemon-paris.ics
          git commit -m "calendar: add Pokémon GO Mega Finale"
          git push origin HEAD:master
