name: Validate permanent calendar health

on:
  push:
    branches: [master]
    paths:
      - 'calendars/calendar-health-policy.json'
      - 'calendars/calendar-health-state.json'
      - 'calendars/calendar-health-heartbeat.json'
      - 'calendars/fortnite-*.ics'
      - 'calendars/harry-potter-*.ics'
      - 'calendars/pokemon-*.ics'
      - 'scripts/validate_calendar_health.py'
      - 'scripts/test_calendar_health.py'
      - '.github/workflows/validate-calendar-health.yml'
  pull_request:
    paths:
      - 'calendars/calendar-health-policy.json'
      - 'calendars/calendar-health-state.json'
      - 'calendars/calendar-health-heartbeat.json'
      - 'calendars/fortnite-*.ics'
      - 'calendars/harry-potter-*.ics'
      - 'calendars/pokemon-*.ics'
      - 'scripts/validate_calendar_health.py'
      - 'scripts/test_calendar_health.py'
      - '.github/workflows/validate-calendar-health.yml'
  schedule:
    - cron: '17 4,16 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate local calendar contracts
        if: github.event_name == 'pull_request'
        run: python scripts/validate_calendar_health.py --static
      - name: Test contract and live monitoring validation
        run: python -m unittest discover -s scripts -p 'test_calendar_health.py'
      - name: Validate permanent health and live raw subscription URLs
        if: github.event_name != 'pull_request'
        run: |
          # raw.githubusercontent.com can briefly lag the just-pushed master commit.
          # Never open a health incident from a single transient CDN mismatch.
          # The public RAW endpoint currently advertises max-age=300.
          # Retry only cache mismatches; genuine monitor/contract failures fail now.
          log_file=$(mktemp)
          for attempt in $(seq 1 12); do
            if python scripts/validate_calendar_health.py --online > "$log_file" 2>&1; then
              cat "$log_file"
              exit 0
            fi
            cat "$log_file"
            if ! grep -q '^ERROR: RAW_CONTENT_MISMATCH:' "$log_file" || grep '^ERROR:' "$log_file" | grep -qv '^ERROR: RAW_CONTENT_MISMATCH:'; then
              exit 1
            fi
            if [ "$attempt" -lt 12 ]; then
              echo "Waiting for RAW cache expiry (${attempt}/12)."
              sleep 30
            fi
          done
          exit 1

  incident-record:
    needs: health
    if: always() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Open one persistent incident on failure, close it on recovery
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RESULT: ${{ needs.health.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          ISSUE_NUMBER=$(gh issue list --repo "$REPO" --state open --search '"[Calendar Health] Incident" in:title' --json number,title --jq '.[] | select(.title == "[Calendar Health] Incident") | .number' | head -n 1)
          if [ "$RESULT" != "success" ]; then
            if [ -z "$ISSUE_NUMBER" ]; then
              gh issue create --repo "$REPO" \
                --title '[Calendar Health] Incident' \
                --body "The permanent Fortnite / Harry Potter / Pokémon calendar health validator failed after retrying transient raw/CDN propagation. This issue is intentionally reused until recovery to avoid duplicate incident records.\n\nWorkflow run: $RUN_URL"
            fi
          else
            if [ -n "$ISSUE_NUMBER" ]; then
              gh issue close "$ISSUE_NUMBER" --repo "$REPO" \
                --comment "✅ Calendar health validation recovered successfully. Closing the persistent incident.\n\nRecovery run: $RUN_URL"
            fi
          fi
