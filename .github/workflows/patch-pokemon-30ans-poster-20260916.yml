name: Patch Pokemon 30th Poster Collection

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/patch-pokemon-30ans-poster-20260916.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - name: Append event safely
        shell: python
        run: |
          from pathlib import Path
          p = Path('calendars/pokemon-paris.ics')
          raw = p.read_bytes()
          text = raw.decode('utf-8')
          uid = 'pokemon-30ans-poster-20260916@openai'
          if uid in text or 'X-POKEMON-PRODUCT-EAN:196214147225' in text:
              print('Already present; no business change.')
              raise SystemExit(0)
          marker = 'END:VCALENDAR'
          if text.count(marker) != 1:
              raise SystemExit('Invalid VCALENDAR structure')
          event = '''BEGIN:VEVENT\r\nUID:pokemon-30ans-poster-20260916@openai\r\nDTSTAMP:20260904T123600Z\r\nLAST-MODIFIED:20260904T123600Z\r\nSEQUENCE:0\r\nSTATUS:CONFIRMED\r\nPRIORITY:5\r\nX-POKEMON-PRIORITY:IMPORTANT\r\nX-POKEMON-REMINDER-PROFILE:TCG_RELEASE\r\nX-POKEMON-ACTION:MONITOR\r\nX-POKEMON-DATE-PRECISION:EXACT_DATE\r\nX-POKEMON-CONFIDENCE:94\r\nX-POKEMON-ACTIONABILITY:58\r\nX-POKEMON-USER-EFFECT-ID:tcg-30ans-poster-fr-20260916\r\nX-POKEMON-PRODUCT-EAN:196214147225\r\nX-POKEMON-DISTRIBUTOR-PRODUCT-ID:169048\r\nX-POKEMON-EVIDENCE-QUORUM:OFFICIAL_PRODUCT|DISTRIBUTOR_IDENTITY|RETAIL_PRODUCT_DATE\r\nDTSTART;VALUE=DATE:20260916\r\nDTEND;VALUE=DATE:20260917\r\nSUMMARY:⭐ ✅ 🃏 Sortie JCC — Collection Poster 30 ans\r\nLOCATION:France\r\nDESCRIPTION:Collection Poster 30e Anniversaire du JCC Pokémon — version française. Identité exacte : EAN 196214147225 — CLD Product ID 169048. Contenu : 3 cartes promo brillantes Artikodin, Électhor et Sulfura, 1 poster recto-verso et 3 boosters 30e Anniversaire. Date France recoupée : 16 septembre 2026. État commercial : aucune disponibilité achetable fiable n'est affirmée par cet événement ; Playin indique actuellement une rupture temporaire/livraison indisponible.\\nSources : https://www.pokemon.com/fr/actualites/jcc-pokemon-produits-30-anniversaire | https://cld.eu/fr/products/169048/the-pok-mon-company-pok-mon-jcc-collection-poster-30e-anniversaire-fr-pokemon-pok-mon-jcc | https://www.play-in.com/fr/produit/659419/coffret-collection-poster-30-ans-pokemon-fr\r\nURL:https://www.play-in.com/fr/produit/659419/coffret-collection-poster-30-ans-pokemon-fr\r\nCATEGORIES:Pokémon,JCC,30e Anniversaire,Sortie produit,Priorité Important\r\nBEGIN:VALARM\r\nTRIGGER:-P1D\r\nACTION:DISPLAY\r\nDESCRIPTION:JCC Pokémon — Collection Poster 30 ans demain : vérifie stock et prix\r\nEND:VALARM\r\nEND:VEVENT\r\n'''
          normalized = text.replace('\r\n','\n').replace('\r','\n')
          normalized = normalized.replace('\nEND:VCALENDAR', '\n' + event.replace('\r\n','\n') + 'END:VCALENDAR')
          out = normalized.replace('\n','\r\n')
          p.write_bytes(out.encode('utf-8'))
      - name: Validate and commit
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          t=Path('calendars/pokemon-paris.ics').read_text(encoding='utf-8')
          assert t.count('BEGIN:VCALENDAR') == 1
          assert t.count('END:VCALENDAR') == 1
          uids=[l[4:] for l in t.splitlines() if l.startswith('UID:')]
          assert len(uids)==len(set(uids))
          assert 'pokemon-30ans-poster-20260916@openai' in t
          PY
          if git diff --quiet -- calendars/pokemon-paris.ics; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add calendars/pokemon-paris.ics
          git commit -m 'pokemon: calendarize 30th Anniversary Poster Collection'
          git push origin master
