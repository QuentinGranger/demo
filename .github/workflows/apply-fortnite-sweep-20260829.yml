name: Apply Fortnite sweep 2026-08-29

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/apply-fortnite-sweep-20260829.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply deterministic Fortnite reconciliation sweep
        run: python scripts/apply_fortnite_sweep_20260829.py
      - name: Validate competitive ledger and projection
        run: python scripts/validate_fortnite_competitive.py
      - name: Validate competitive deadlines
        run: python scripts/validate_fortnite_competitive_deadlines.py
      - name: Validate change ledger and outbox reconciliation
        run: python scripts/validate_fortnite_change_ledger.py
      - name: Validate Fortnite ICS
        run: python scripts/validate_fortnite_ics.py
      - name: Validate season/pass lifecycle
        run: python scripts/validate_fortnite_season_pass_lifecycle.py
      - name: Validate lore taxonomy
        run: python scripts/validate_fortnite_lore_taxonomy.py
      - name: Validate physical events
        run: python scripts/validate_fortnite_physical_events.py
      - name: Deep health check including live raw subscriptions
        run: python scripts/validate_calendar_health.py --online
      - name: Commit semantic ledger changes if needed
        run: |
          if git diff --quiet; then
            echo 'No semantic change to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            calendars/fortnite-service-events-france.json \
            calendars/fortnite-competitive-ledger-france.json \
            calendars/fortnite-competitive-index-france.json \
            calendars/fortnite-change-ledger.json \
            calendars/fortnite-change-index-france.json
          git commit -m 'chore: reconcile Aug 29 Fortnite service and EU schedule'
          git push
