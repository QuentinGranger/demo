name: Patch ETB 30 ans alert calendar

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/patch-etb-alert.yml'
      - 'scripts/patch_etb_alert.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch ETB source calendar
        run: python scripts/patch_etb_alert.py
      - name: Synchronize global Pokémon calendar
        run: python scripts/sync_pokemon_global.py
      - name: Verify source and global calendars
        run: |
          python -c "from pathlib import Path; uid='UID:watch-etb-30ans-fr-20260830@openai'; url='https://lestresorsdekanto.com/products/etb-30-ans-me5-5'; files=[Path('calendars/pokemon-tcg-france.ics'),Path('calendars/pokemon-paris.ics')]; [(lambda t,p: (uid in t and url in t and 'SUMMARY:🔴 PRÉCO OUVERTE — Les Trésors de Kanto — ETB 30 ans' in t) or (_ for _ in ()).throw(AssertionError(str(p))))(p.read_text(encoding='utf-8'),p) for p in files]"
      - name: Commit calendar update
        run: |
          if git diff --quiet -- calendars/pokemon-tcg-france.ics calendars/pokemon-paris.ics; then
            echo 'No calendar change required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add calendars/pokemon-tcg-france.ics calendars/pokemon-paris.ics
          git commit -m 'Update ETB 30th alert: Les Tresors de Kanto preorder'
          git push origin HEAD:master
