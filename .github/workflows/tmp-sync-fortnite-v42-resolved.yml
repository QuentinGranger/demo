name: One-shot sync Fortnite v42 resolved

on:
  push:
    paths:
      - '.github/workflows/tmp-sync-fortnite-v42-resolved.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply resolved service transition atomically
        shell: bash
        run: |
          python - <<'PY'
          import json, hashlib
          from pathlib import Path

          ROOT = Path('.')
          CAL = ROOT / 'calendars'
          detected = '2026-08-20T11:31:00Z'
          incident_url = 'https://status.epicgames.com/incidents/b0jf1mxvlc2l'
          service_id = 'epic-fortnite-v42-00-20260820'
          calendar_uid = 'fortnite-service-v42-00-20260820@openai'

          def canon(v):
              return json.dumps(v, ensure_ascii=False, sort_keys=True, separators=(',', ':'))
          def sha(v):
              return hashlib.sha256(v.encode('utf-8')).hexdigest()

          # 1) Canonical service ledger
          sp = CAL / 'fortnite-service-events-france.json'
          service = json.loads(sp.read_text(encoding='utf-8'))
          entry = next(e for e in service['entries'] if e['service_event_id'] == service_id)
          if entry.get('state') != 'RESOLVED':
              before = {
                  'state': entry.get('state'),
                  'provider_phase': entry.get('provider_phase'),
                  'actual_end_at': entry.get('actual_end_at'),
              }
              entry['previous_state'] = entry.get('state')
              entry['state'] = 'RESOLVED'
              entry['provider_phase'] = 'RESOLVED'
              entry['actual_end_at'] = detected
              entry['last_changed_at'] = detected
              entry['last_verified_at'] = detected
              entry['internal_actionability'] = 'NONE'
              entry['internal_priority_score'] = 0
              for c in entry.get('component_states', []):
                  c['status'] = 'OPERATIONAL'
                  c['impact_note'] = 'Epic Status reports the scheduled v42.00 maintenance completed; Fortnite components are operational.'
                  c['observed_at'] = detected
              hist = entry.setdefault('history', [])
              hist.append({
                  'at': detected,
                  'event_type': 'STATE_TRANSITION',
                  'source_id': 'epic_status',
                  'source_url': incident_url,
                  'from': before['state'],
                  'to': 'RESOLVED',
                  'note': 'Epic Status marked Fortnite v42.00 scheduled maintenance completed at 11:31 UTC.'
              })
              hist.append({
                  'at': detected,
                  'event_type': 'TIMING_CHANGED',
                  'source_id': 'epic_status',
                  'source_url': incident_url,
                  'old_value': before['actual_end_at'],
                  'new_value': detected,
                  'note': 'Official actual completion time recorded.'
              })
              service['updated_at'] = detected
              sp.write_text(json.dumps(service, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          # 2) Change ledger causal transition (silent routine scheduled resolution)
          cp = CAL / 'fortnite-change-ledger.json'
          ch = json.loads(cp.read_text(encoding='utf-8'))
          existing = [c for c in ch.get('changes', []) if c.get('domain') == 'SERVICE' and c.get('subject_key') == service_id]
          if not any(c.get('material_after', {}).get('state') == 'RESOLVED' and c.get('material_after', {}).get('actual_end_at') == detected for c in existing):
              latest = max(existing, key=lambda c: int(c.get('subject_revision', 0))) if existing else None
              revision = (int(latest['subject_revision']) + 1) if latest else 1
              parent = latest['change_id'] if latest else None
              scope_key = None
              subject_scope_key = 'sub_' + sha('SERVICE|' + service_id + '|')
              material_before = {'state':'STARTED','actual_end_at':None}
              material_after = {'state':'RESOLVED','actual_end_at':detected,'fortnite_operational':True}
              evidence = 'EPIC_STATUS_COMPLETED'
              transition_payload = {
                  'change_type':'MAINTENANCE_CHANGED',
                  'material_before':material_before,
                  'material_after':material_after,
                  'material_evidence_state':evidence,
              }
              transition_fingerprint = sha(canon(transition_payload))
              state_fingerprint = sha(canon(material_after))
              cid_payload = '|'.join(['SERVICE', service_id, '', str(revision), parent or '', transition_fingerprint])
              change_id = 'chg_' + sha(cid_payload)[:24]
              rec = {
                  'change_id': change_id,
                  'domain': 'SERVICE',
                  'subject_scope_key': subject_scope_key,
                  'subject_key': service_id,
                  'subject_revision': revision,
                  'causal_parent_change_id': parent,
                  'change_type': 'MAINTENANCE_CHANGED',
                  'materiality': 'CALENDAR',
                  'state_fingerprint': state_fingerprint,
                  'transition_fingerprint': transition_fingerprint,
                  'detected_at': detected,
                  'source_refs': [incident_url, 'https://status.epicgames.com/'],
                  'notification_disposition': 'SILENT_POLICY',
                  'scope_key': scope_key,
                  'material_before': material_before,
                  'material_after': material_after,
                  'material_evidence_state': evidence,
                  'causal_source_change_ids': [],
                  'notes': 'Routine scheduled maintenance resolution: calendar state changes, but notification remains silent under service policy.'
              }
              ch.setdefault('changes', []).append(rec)
              ch['updated_at'] = detected
              cp.write_text(json.dumps(ch, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          # 3) Rebuild derived change index from canonical ledger + outbox
          ip = CAL / 'fortnite-change-index-france.json'
          idx = json.loads(ip.read_text(encoding='utf-8'))
          changes = ch.get('changes', [])
          heads = {}
          by_domain = {}
          by_type = {}
          open_by_subject = {}
          for c in changes:
              sk = c['subject_scope_key']
              rev = int(c['subject_revision'])
              if sk not in heads or rev > heads[sk]['revision']:
                  heads[sk] = {'revision': rev, 'change_id': c['change_id']}
              by_domain.setdefault(c['domain'], []).append(c['change_id'])
              by_type.setdefault(c['change_type'], []).append(c['change_id'])
              if c.get('state', 'OPEN') == 'OPEN':
                  open_by_subject.setdefault(sk, []).append(c['change_id'])
          for d in (by_domain, by_type, open_by_subject):
              for k in d:
                  d[k] = sorted(set(d[k]))
          idx['updated_at'] = detected
          idx['subject_heads'] = dict(sorted(heads.items()))
          idx['by_domain'] = dict(sorted(by_domain.items()))
          idx['by_change_type'] = dict(sorted(by_type.items()))
          idx['open_changes_by_subject'] = dict(sorted(open_by_subject.items()))
          outbox = json.loads((CAL / 'fortnite-notification-outbox-france.json').read_text(encoding='utf-8'))
          intents = outbox.get('notification_intents', outbox.get('intents', []))
          events = outbox.get('delivery_events', [])
          idx.setdefault('stats', {})['changes'] = len(changes)
          idx['stats']['subjects'] = len(heads)
          idx['stats']['notification_intents'] = len(intents)
          idx['stats']['consumed_notification_keys'] = len(idx.get('consumed_notification_keys', []))
          idx['stats']['unknown_delivery'] = len(idx.get('unknown_delivery_keys', []))
          ip.write_text(json.dumps(idx, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          # 4) Replace service VEVENT in specialist + global; preserve same UID, increment SEQUENCE.
          def fold_line(line, limit=75):
              if len(line.encode('utf-8')) <= limit:
                  return [line]
              out=[]; cur=''; first=True
              for chx in line:
                  prefix = '' if first else ' '
                  candidate = cur + chx
                  if len((prefix + candidate).encode('utf-8')) > limit and cur:
                      out.append(prefix + cur)
                      cur = chx
                      first=False
                  else:
                      cur = candidate
              prefix = '' if first else ' '
              out.append(prefix + cur)
              return out

          new_lines = [
              'BEGIN:VEVENT',
              'UID:' + calendar_uid,
              'DTSTAMP:20260820T113100Z',
              'LAST-MODIFIED:20260820T113100Z',
              'SEQUENCE:2',
              'STATUS:CONFIRMED',
              'PRIORITY:9',
              'X-FORTNITE-PRIORITY:INFO',
              'X-FORTNITE-ACTION:PLAY',
              'X-FORTNITE-EVENT-TYPE:SERVICE_DOWNTIME',
              'X-FORTNITE-SERVICE-EVENT-ID:' + service_id,
              'X-FORTNITE-SERVICE-KIND:SCHEDULED_MAINTENANCE',
              'X-FORTNITE-SERVICE-STATE:RESOLVED',
              'X-FORTNITE-SERVICE-PROVIDER-PHASE:RESOLVED',
              'X-FORTNITE-SERVICE-IMPACT:UNSPECIFIED',
              'X-FORTNITE-SERVICE-ACTIONABILITY:NONE',
              'X-FORTNITE-AFFECTED-SERVICE:Game Services,Login,Parties/Friends,Voice Chat,Matchmaking,Stats/Leaderboards,Item Shop,Fortnite Crew',
              'X-FORTNITE-SERVICE-SOURCE-ID:epic_status',
              'X-FORTNITE-SERVICE-RELATION-TYPE:PATCH_DEPLOYMENT',
              'X-FORTNITE-PATCH-VERSION:42.00',
              'X-FORTNITE-MATCHMAKING-DISABLED-AT:20260820T073000',
              'X-FORTNITE-ACTUAL-START-AT:20260820T080011',
              'X-FORTNITE-ACTUAL-END-AT:20260820T133100',
              'X-FORTNITE-TIME-PRECISION:EXACT',
              'X-FORTNITE-FIRST-ADDED-AT:20260820T001202Z',
              'X-FORTNITE-NEW-UNTIL:20260825T001202Z',
              'DTSTART;TZID=Europe/Paris:20260820T080000',
              'DTEND;TZID=Europe/Paris:20260820T133100',
              'SUMMARY:ℹ️ ✅ 🆕 🛠️ Maintenance Fortnite v42.00 — terminée',
              'DESCRIPTION:Priorité : ℹ️ Info — la maintenance planifiée Fortnite v42.00 est terminée.\\nEpic Status l’a marquée « Completed » le 20 août 2026 à 11:31 UTC, soit 13:31 heure de Paris.\\nFortnite, Game Services, Login, Matchmaking, groupes/amis, chat vocal, stats/classements, boutique et Fortnite Crew sont actuellement opérationnels sur Epic Status.\\nLa fenêtre prévue se terminait à 13:00 à Paris ; l’heure 13:31 est l’heure de fin réellement publiée, pas une estimation.\\nSource : ' + incident_url,
              'URL:' + incident_url,
              'CATEGORIES:Fortnite,Maintenance,Mise à jour,v42.00,Services',
              'END:VEVENT'
          ]
          folded=[]
          for l in new_lines:
              folded.extend(fold_line(l))
          new_block='\r\n'.join(folded)

          def replace_event(path):
              raw = path.read_text(encoding='utf-8-sig').replace('\r\n','\n').replace('\r','\n')
              lines = raw.split('\n')
              # unfold for reliable UID discovery
              unfolded=[]
              for l in lines:
                  if l.startswith((' ', '\t')) and unfolded:
                      unfolded[-1] += l[1:]
                  else:
                      unfolded.append(l)
              start=end=None
              for i,l in enumerate(unfolded):
                  if l == 'BEGIN:VEVENT':
                      j=i+1
                      uid=None
                      while j < len(unfolded) and unfolded[j] != 'END:VEVENT':
                          if unfolded[j].startswith('UID:'):
                              uid=unfolded[j][4:]
                          j+=1
                      if uid == calendar_uid:
                          start=i; end=j; break
              if start is None or end is None:
                  raise RuntimeError(f'{calendar_uid} not found in {path}')
              before = unfolded[:start]
              after = unfolded[end+1:]
              # Fold all lines deterministically to RFC5545 <=75 octets.
              output=[]
              for l in before:
                  if l != '': output.extend(fold_line(l))
              output.extend(new_block.split('\r\n'))
              for l in after:
                  if l != '': output.extend(fold_line(l))
              path.write_bytes(('\r\n'.join(output) + '\r\n').encode('utf-8'))

          replace_event(CAL / 'fortnite-updates-france.ics')
          replace_event(CAL / 'fortnite-paris.ics')
          PY

      - name: Validate Fortnite and calendar health
        shell: bash
        run: |
          python scripts/validate_fortnite_ics.py
          python scripts/validate_fortnite_change_ledger.py
          python scripts/validate_calendar_health.py

      - name: Commit synchronized state and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "calendar-health-bot"
          git config user.email "calendar-health-bot@users.noreply.github.com"
          git rm .github/workflows/tmp-sync-fortnite-v42-resolved.yml
          git add -- calendars/fortnite-service-events-france.json calendars/fortnite-change-ledger.json calendars/fortnite-change-index-france.json calendars/fortnite-updates-france.ics calendars/fortnite-paris.ics
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fortnite: mark v42.00 maintenance resolved"
          git push origin HEAD:master
