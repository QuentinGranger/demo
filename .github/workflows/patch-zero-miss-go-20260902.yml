name: ZERO MISS Pokémon GO 2026-09-02

on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/patch-zero-miss-go-20260902.yml'
      - 'scripts/patch_zero_miss_go_20260902.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Patch canonical calendar
        run: python3 scripts/patch_zero_miss_go_20260902.py

      - name: Commit changes
        run: |
          if git diff --quiet -- calendars/pokemon-paris.ics; then
            echo "No business change"
            exit 0
          fi
          git config user.name "pokemon-calendar-bot"
          git config user.email "pokemon-calendar-bot@users.noreply.github.com"
          git add calendars/pokemon-paris.ics
          git commit -m "calendar: add Pokémon GO events announced 2 Sep"
          git push origin HEAD:master
