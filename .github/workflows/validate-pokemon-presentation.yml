name: Validate Pokémon calendar presentation

on:
  push:
    paths:
      - 'calendars/pokemon-*.ics'
      - 'calendars/pokemon-presentation-policy.json'
      - 'scripts/*pokemon*.py'
      - '.github/workflows/validate-pokemon-presentation.yml'
  pull_request:
    paths:
      - 'calendars/pokemon-*.ics'
      - 'calendars/pokemon-presentation-policy.json'
      - 'scripts/*pokemon*.py'
      - '.github/workflows/validate-pokemon-presentation.yml'

permissions:
  contents: read

jobs:
  presentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s scripts -p 'test_pokemon_calendar_presentation.py'
      - run: python scripts/pokemon_calendar_presentation.py --check
