name: Patch verified Harry Potter events 2026-08-22

on:
  push:
    paths:
      - 'scripts/patch_hp_events_20260822.py'
      - '.github/workflows/patch-hp-events-20260822.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply idempotent calendar patch
        run: python scripts/patch_hp_events_20260822.py
      - name: Validate generic calendar health
        run: python scripts/validate_calendar_health.py
      - name: Commit material changes
        run: |
          if git diff --quiet; then
            echo "No material calendar change"
            exit 0
          fi
          git config user.name "calendar-bot"
          git config user.email "calendar-bot@users.noreply.github.com"
          git add calendars/harry-potter-paris.ics calendars/harry-potter-events-france-paris.ics calendars/harry-potter-sources-france.json calendars/harry-potter-ticketing-providers-france.json calendars/harry-potter-ticketing-france.json
          git commit -m "Add verified Harry Potter Paris/IDF events [skip ci]"
          git push
