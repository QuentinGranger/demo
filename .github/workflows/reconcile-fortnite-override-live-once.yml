name: Reconcile Fortnite Override live state once

on:
  push:
    paths:
      - '.github/workflows/reconcile-fortnite-override-live-once.yml'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reconcile canonical season state and change ledger
        run: |
          python - <<'PY'
          import hashlib, json
          from datetime import datetime, timezone
          from pathlib import Path

          root = Path('.')
          cal = root / 'calendars'
          now = datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z')
          homepage = 'https://www.fortnite.com/?lang=en-US'
          override_news = 'https://www.fortnite.com/news/fortnite-override-break-the-rules-change-the-game'
          battle_pass_url = 'https://www.fortnite.com/battle-pass?lang=en-US'

          def load(name):
              return json.loads((cal / name).read_text(encoding='utf-8'))
          def dump(name, obj):
              (cal / name).write_text(json.dumps(obj, ensure_ascii=False, separators=(',', ':')) + '\n', encoding='utf-8')
          def canon(obj):
              return json.dumps(obj, ensure_ascii=False, sort_keys=True, separators=(',', ':'))
          def sha(obj):
              return hashlib.sha256(canon(obj).encode('utf-8')).hexdigest()
          def subject_scope(domain, subject_key, scope_key=None):
              raw = f"{domain}|{subject_key}|{scope_key or ''}"
              return 'sub_' + hashlib.sha256(raw.encode()).hexdigest()

          lifecycle = load('fortnite-season-pass-lifecycle-france.json')
          tracks = {t['track_id']: t for t in lifecycle.get('tracks', [])}

          # Current official Fortnite surface explicitly says the new season is live now.
          c7s4 = tracks['br-season-c7s4-override']
          if c7s4.get('state') == 'ANNOUNCED':
              c7s4['state'] = 'ACTIVE'
              if homepage not in c7s4.setdefault('source_urls', []):
                  c7s4['source_urls'].append(homepage)
              c7s4.setdefault('history', []).append({
                  'at': now,
                  'type': 'TRACK_STARTED',
                  'note': 'Fortnite official current-season surface explicitly marks Chapter 7 Season 4: Override as live. No launch timestamp is backfilled; playable start time remains unpublished.'
              })

          c7s3 = tracks['br-season-c7s3-runners']
          if c7s3.get('state') == 'ACTIVE':
              c7s3['state'] = 'ENDED'
              rels = c7s3.setdefault('relations', [])
              if not any(r.get('type') == 'REPLACED_BY' and r.get('target_id') == 'br-season-c7s4-override' for r in rels):
                  rels.append({
                      'type': 'REPLACED_BY',
                      'target_id': 'br-season-c7s4-override',
                      'confidence': 'STRONG_OFFICIAL_CROSS_REFERENCE',
                      'source_id': 'fortnite_news',
                      'source_url': homepage,
                      'observed_at': now
                  })
              c7s3.setdefault('history', []).append({
                  'at': now,
                  'type': 'TRACK_ENDED',
                  'note': 'The officially identified successor Chapter 7 Season 4: Override is now explicitly live. C7S3 is therefore no longer the active BR season; no exact C7S3 gameplay end instant is inferred.'
              })

          pass_c7s3 = tracks['battle-pass-c7s3-runners']
          if pass_c7s3.get('state') == 'END_ANNOUNCED':
              pass_c7s3['state'] = 'ENDED'
              pass_c7s3.setdefault('history', []).append({
                  'at': now,
                  'type': 'TRACK_ENDED',
                  'note': 'The official Aug 20 Runners Battle Pass end date has passed and the current official Battle Pass is Override. Separate purchase, progression and reward-claim close times remain UNKNOWN unless explicitly published.'
              })

          lifecycle['updated_at'] = now
          dump('fortnite-season-pass-lifecycle-france.json', lifecycle)

          # Rebuild only the derived season/pass index from canonical tracks.
          season_index = load('fortnite-season-pass-index-france.json')
          by_state = {}
          for t in lifecycle.get('tracks', []):
              by_state.setdefault(t.get('state','UNKNOWN'), []).append(t['track_id'])
          season_index['generated_at'] = now
          season_index['by_state'] = {k: sorted(v) for k,v in sorted(by_state.items())}
          dump('fortnite-season-pass-index-france.json', season_index)

          ledger = load('fortnite-change-ledger.json')
          changes = ledger.setdefault('changes', [])

          def latest_for(scope):
              vals = [c for c in changes if c.get('subject_scope_key') == scope]
              return max(vals, key=lambda c: c.get('subject_revision',0)) if vals else None

          def append_change(subject_key, before, after, evidence, source_refs, notes):
              domain = 'SEASON_PASS'
              scope = subject_scope(domain, subject_key)
              # Idempotency if this desired state was already accepted by a concurrent run.
              for c in changes:
                  if c.get('subject_scope_key') == scope and c.get('change_type') == 'STATUS_CHANGED' and c.get('material_after') == after:
                      return c['change_id']
              parent = latest_for(scope)
              rev = (parent.get('subject_revision',0) + 1) if parent else 1
              parent_id = parent.get('change_id') if parent else None
              trans_obj = {
                  'change_type':'STATUS_CHANGED',
                  'material_before':before,
                  'material_after':after,
                  'material_evidence_state':evidence,
              }
              tf = sha(trans_obj)
              sf = sha(after)
              identity = f"{domain}|{subject_key}||{rev}|{parent_id or ''}|{tf}"
              cid = 'chg_' + hashlib.sha256(identity.encode('utf-8')).hexdigest()[:24]
              rec = {
                  'change_id':cid,
                  'domain':domain,
                  'subject_scope_key':scope,
                  'subject_key':subject_key,
                  'subject_revision':rev,
                  'causal_parent_change_id':parent_id,
                  'change_type':'STATUS_CHANGED',
                  'materiality':'LEDGER_ONLY',
                  'state_fingerprint':sf,
                  'transition_fingerprint':tf,
                  'detected_at':now,
                  'source_refs':source_refs,
                  'notification_disposition':'STALE',
                  'scope_key':None,
                  'material_before':before,
                  'material_after':after,
                  'material_evidence_state':evidence,
                  'policy_version':'FORTNITE_CHANGE_ENGINE_FR_V2',
                  'notes':notes,
              }
              changes.append(rec)
              return cid

          append_change(
              'br-season-c7s4-override',
              {'track_id':'br-season-c7s4-override','state':'ANNOUNCED','start_time':'UNPUBLISHED'},
              {'track_id':'br-season-c7s4-override','state':'ACTIVE','start_time':'UNPUBLISHED'},
              'FORTNITE_OFFICIAL_CURRENT_SEASON_LIVE',
              [homepage, override_news],
              'Current-state confirmation arrived after launch and after the prior Override announcement alert. No backfill notification and no synthetic launch timestamp.'
          )
          append_change(
              'br-season-c7s3-runners',
              {'track_id':'br-season-c7s3-runners','state':'ACTIVE'},
              {'track_id':'br-season-c7s3-runners','state':'ENDED','successor_id':'br-season-c7s4-override','end_time':'UNPUBLISHED'},
              'OFFICIAL_SUCCESSOR_NOW_ACTIVE',
              [homepage, override_news],
              'Predecessor lifecycle reconciled from the officially active successor. Exact predecessor end instant is intentionally not inferred.'
          )
          append_change(
              'battle-pass-c7s3-runners',
              {'track_id':'battle-pass-c7s3-runners','state':'END_ANNOUNCED','end_date':'2026-08-20'},
              {'track_id':'battle-pass-c7s3-runners','state':'ENDED','end_date':'2026-08-20','progression_close':'UNKNOWN','claim_window':'UNKNOWN'},
              'OFFICIAL_END_DATE_PASSED_CURRENT_PASS_REPLACED',
              [battle_pass_url, homepage],
              'Pass lifecycle reconciled after its official date-only end. No separate progression/claim cutoff is inferred.'
          )
          ledger['updated_at'] = now
          if not any(h.get('type') == 'MATERIAL_SEASON_STATE_RECONCILED' and h.get('at') == now for h in ledger.setdefault('history', [])):
              ledger['history'].append({
                  'at':now,
                  'type':'MATERIAL_SEASON_STATE_RECONCILED',
                  'note':'Official Fortnite current-season state reconciled C7S4 Override to ACTIVE and retired C7S3 season/pass states without backfilling a launch timestamp or user notification.'
              })
          dump('fortnite-change-ledger.json', ledger)

          # Rebuild the entire derived change index from canonical ledger + outbox.
          outbox = load('fortnite-notification-outbox-france.json')
          idx = load('fortnite-change-index-france.json')
          heads = {}
          by_domain = {}
          by_type = {}
          open_by_subject = {}
          for c in ledger.get('changes', []):
              cid = c['change_id']
              sk = c['subject_scope_key']
              rev = c['subject_revision']
              if sk not in heads or rev > heads[sk]['revision']:
                  heads[sk] = {'revision':rev,'change_id':cid}
              by_domain.setdefault(c['domain'], []).append(cid)
              by_type.setdefault(c['change_type'], []).append(cid)
              if c.get('state','OPEN') == 'OPEN':
                  open_by_subject.setdefault(sk, []).append(cid)
          consumed = sorted(outbox.get('consumed_keys', {}).keys())
          last_by_key = {}
          for e in sorted(outbox.get('delivery_events', []), key=lambda x:x.get('at','')):
              if e.get('state') in {'RESERVED','SENT','UNKNOWN_DELIVERY'}:
                  last_by_key[e.get('notification_key')] = e.get('state')
          unknown = sorted(k for k,v in last_by_key.items() if v == 'UNKNOWN_DELIVERY')
          idx['updated_at'] = now
          idx['subject_heads'] = {k:heads[k] for k in sorted(heads)}
          idx['by_domain'] = {k:sorted(v) for k,v in sorted(by_domain.items())}
          idx['by_change_type'] = {k:sorted(v) for k,v in sorted(by_type.items())}
          idx['open_changes_by_subject'] = {k:sorted(v) for k,v in sorted(open_by_subject.items())}
          idx['consumed_notification_keys'] = consumed
          idx['unknown_delivery_keys'] = unknown
          idx.setdefault('pending_reconciliation', [])
          idx['stats'] = {
              'changes':len(ledger.get('changes', [])),
              'subjects':len(heads),
              'notification_intents':len(outbox.get('intents', [])),
              'consumed_notification_keys':len(consumed),
              'unknown_delivery':len(unknown),
              'pending_reconciliation':len(idx.get('pending_reconciliation', [])),
          }
          dump('fortnite-change-index-france.json', idx)
          PY

      - name: Validate reconciled state
        run: |
          python scripts/validate_fortnite_change_ledger.py
          if [ -f scripts/validate_fortnite_season_pass_lifecycle.py ]; then python scripts/validate_fortnite_season_pass_lifecycle.py; fi

      - name: Commit reconciliation and remove one-shot workflow
        run: |
          git config user.name "calendar-health-bot"
          git config user.email "calendar-health-bot@users.noreply.github.com"
          git rm .github/workflows/reconcile-fortnite-override-live-once.yml
          git add calendars/fortnite-season-pass-lifecycle-france.json calendars/fortnite-season-pass-index-france.json calendars/fortnite-change-ledger.json calendars/fortnite-change-index-france.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix(fortnite): reconcile Override live lifecycle"
          git push
