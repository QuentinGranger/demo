name: Apply Harry Potter Versailles update once

on:
  push:
    paths:
      - 'scripts/apply_hp_versailles_20260824.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply idempotent calendar update
        run: python scripts/apply_hp_versailles_20260824.py
      - name: Commit generated calendar changes and remove one-shot helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "feat: add Harry Potter Retour à Poudlard Versailles 2026"
            git push
          fi
