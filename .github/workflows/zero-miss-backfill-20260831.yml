          ]

          for raw in events:
              raw = raw.replace('\n', nl)
              uid = re.search(r'^UID:(.+)$', raw, flags=re.M).group(1).strip().rstrip('\r')
              if f'UID:{uid}' not in data:
                  data = data.replace('END:VCALENDAR' + nl, raw + nl + 'END:VCALENDAR' + nl)

          # Sanity checks
          if data.count('BEGIN:VCALENDAR') != 1 or data.count('END:VCALENDAR') != 1:
              raise SystemExit('Invalid VCALENDAR envelope')
          uids = re.findall(r'^UID:(.+?)\r?$', data, flags=re.M)
          if len(uids) != len(set(uids)):
              raise SystemExit('Duplicate UID detected')

          p.write_bytes(data.encode('utf-8'))

      - name: Commit calendar changes
        run: |
          if git diff --quiet -- calendars/pokemon-paris.ics; then
            echo "No calendar changes needed"
            exit 0
          fi
          git config user.name "ZERO_MISS bot"
          git config user.email "actions@users.noreply.github.com"
          git add calendars/pokemon-paris.ics
          git commit -m "ZERO_MISS: reconcile confirmed calendar gaps"
          git push origin master
