name: ZERO_MISS backfill 2026-08-31

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/zero-miss-backfill-20260831.yml'
      - 'scripts/patch_zero_miss_backfill_20260831.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch canonical Pokemon calendar
        run: python scripts/patch_zero_miss_backfill_20260831.py
      - name: Verify required events
        run: |
          python -c "from pathlib import Path; t=Path('calendars/pokemon-paris.ics').read_text(encoding='utf-8'); required=['UID:pokemon-go-mega-ascension-20260831@openai','UID:pokemon-play-season-2027-start-20260901@openai','UID:pokemon-go-mega-finale-20260905@openai','UID:pokemon-go-worlds2026-rewards-expiry-20260911@openai','UID:pokemon-go-pokemonxp-pikachu-claim-20260912@openai','UID:tcgl-worlds2026-redeem-deadline-20260925@openai','UID:pokemon-go-lego-les-halles-20260803@openai']; assert all(x in t for x in required); assert t.count('BEGIN:VCALENDAR')==1 and t.count('END:VCALENDAR')==1"
      - name: Commit calendar update
        run: |
          if git diff --quiet -- calendars/pokemon-paris.ics; then
            echo 'No calendar change required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add calendars/pokemon-paris.ics
          git commit -m 'ZERO_MISS: reconcile confirmed Pokemon calendar gaps'
          git push origin HEAD:master
