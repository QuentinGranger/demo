name: ZERO_MISS backfill 2026-08-31

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/zero-miss-backfill-20260831.yml'

permissions:
  contents: write

jobs:
  patch-calendar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - name: Patch canonical Pokemon calendar
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('calendars/pokemon-paris.ics')
          data = p.read_bytes().decode('utf-8')
          nl = '\r\n' if '\r\n' in data else '\n'

          # Material retail-state correction: Passion Geek ETB 30 ans is no longer open/allocating.
          data = data.replace('STATUS=ALLOCATIONS_TONIGHT;CONFIDENCE=88;SELLER=86;PRICE=60.00:', 'STATUS=SOLD_OUT;CONFIDENCE=88;SELLER=86;PRICE=60.00:')
          data = data.replace('SUMMARY:🟠 DATE/HEURE ANNONCÉE — Passion Geek — ETB 30 ans', 'SUMMARY:ℹ️ RUPTURE — Passion Geek — ETB 30 ans')
          data = data.replace('X-POKEMON-LATEST-ALERT-STATUS:ALLOCATIONS_TONIGHT', 'X-POKEMON-LATEST-ALERT-STATUS:SOLD_OUT')
          data = data.replace('X-POKEMON-LATEST-ALERT-LEVEL:ORANGE_DATE_WINDOW_ANNOUNCED', 'X-POKEMON-LATEST-ALERT-LEVEL:INFORMATIONAL_SOLD_OUT')

