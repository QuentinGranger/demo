name: Apply Crash Bandicoot Override Cup 2026-08-28

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/apply-crash-bandicoot-override-20260828.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply deterministic Crash Bandicoot competitive update
        run: python scripts/apply_crash_bandicoot_override_20260828.py
      - name: Validate Fortnite ICS
        run: python scripts/validate_fortnite_ics.py
      - name: Validate competitive intelligence
        run: python scripts/validate_fortnite_competitive.py
      - name: Validate competitive deadlines
        run: python scripts/validate_fortnite_competitive_deadlines.py
      - name: Validate season/pass lifecycle
        run: python scripts/validate_fortnite_season_pass_lifecycle.py
      - name: Validate lore/taxonomy
        run: python scripts/validate_fortnite_lore_taxonomy.py
      - name: Validate physical events
        run: python scripts/validate_fortnite_physical_events.py
      - name: Validate change ledger
        run: python scripts/validate_fortnite_change_ledger.py
      - name: Validate permanent calendar health online
        run: python scripts/validate_calendar_health.py --online
      - name: Commit semantic update if needed
        run: |
          if git diff --quiet; then
            echo 'No semantic change to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add calendars/fortnite-competitive-ledger-france.json calendars/fortnite-competitive-index-france.json calendars/fortnite-change-ledger.json calendars/fortnite-change-index-france.json calendars/fortnite-competitive-france.ics calendars/fortnite-paris.ics
          git commit -m 'feat: add Crash Bandicoot Override Cup EU'
          git push

